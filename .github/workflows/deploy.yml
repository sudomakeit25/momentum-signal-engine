name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    name: Deploy Lambda (SAM)
    runs-on: ubuntu-latest
    outputs:
      frontend-bucket: ${{ steps.outputs.outputs.frontend-bucket }}
      cloudfront-id: ${{ steps.outputs.outputs.cloudfront-id }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM build
        run: cd infra && sam build

      - name: SAM deploy
        run: cd infra && sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Get stack outputs
        id: outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks --stack-name mse-stack \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucket'].OutputValue" \
            --output text)
          CDN_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='mse-stack'].Id" \
            --output text)
          # Fallback: get distribution ID from stack
          if [ -z "$CDN_ID" ]; then
            CDN_DOMAIN=$(aws cloudformation describe-stacks --stack-name mse-stack \
              --query "Stacks[0].Outputs[?OutputKey=='CloudFrontUrl'].OutputValue" \
              --output text | sed 's|https://||')
            CDN_ID=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?DomainName=='${CDN_DOMAIN}'].Id" \
              --output text)
          fi
          echo "frontend-bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "cloudfront-id=$CDN_ID" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Deploy Frontend (S3 + CloudFront)
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build static export
        run: cd frontend && npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

      - name: Sync to S3
        run: |
          aws s3 sync frontend/out/ s3://${{ needs.deploy-backend.outputs.frontend-bucket }}/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"
          aws s3 sync frontend/out/ s3://${{ needs.deploy-backend.outputs.frontend-bucket }}/ \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html"

      - name: Invalidate CloudFront
        if: needs.deploy-backend.outputs.cloudfront-id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ needs.deploy-backend.outputs.cloudfront-id }} \
            --paths "/*"
